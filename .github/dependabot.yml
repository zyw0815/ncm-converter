version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: monthly
    # Disable routine version-update PRs for now; the app still supports
    # Python 3.9 and latest dependency releases frequently drop that support.
    # Keep GitHub Dependabot security alerts enabled in repository settings.
    open-pull-requests-limit: 0
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
